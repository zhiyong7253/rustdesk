name: Build zhiyong7253 (Quick APK Patch)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options:
          - aarch64
          - armv7a
        default: aarch64

env:
  VERSION: "1.4.6"
  NEW_PKG: "com.zhiyong7253.remote"
  NEW_NAME: "zhiyong7253"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool_2.10.0.jar /usr/local/bin/

      - name: Download official APK
        run: |
          wget -q "https://github.com/rustdesk/rustdesk/releases/download/${VERSION}/rustdesk-${VERSION}-${{ inputs.arch }}-signed.apk" -O original.apk

      - name: Decompile
        run: apktool d original.apk -o out -f

      - name: Patch package name
        run: |
          sed -i "s|package=\"com.carriez.flutter_hbb\"|package=\"${NEW_PKG}\"|g" out/AndroidManifest.xml
          sed -i "s|android:label=\"RustDesk\"|android:label=\"${NEW_NAME}\"|g" out/AndroidManifest.xml
          sed -i "s|android:label=\"RustDesk Input\"|android:label=\"${NEW_NAME} Input\"|g" out/AndroidManifest.xml
          # Replace in all smali/xml
          find out/ -name "*.smali" -exec sed -i "s|com/carriez/flutter_hbb|com/zhiyong7253/remote|g" {} +
          find out/ -name "*.xml" -exec sed -i "s|RustDesk|${NEW_NAME}|g" {} +

      - name: Rebuild
        run: apktool b out -o unsigned.apk

      - name: Sign
        run: |
          keytool -genkey -v -keystore release.keystore -alias zhiyong -keyalg RSA -keysize 2048 -validity 10000 -storepass zhiyong -keypass zhiyong -dname "CN=zhiyong, O=zhiyong, C=CN"
          jarsigner -keystore release.keystore -storepass zhiyong -keypass zhiyong -sigalg SHA256withRSA unsigned.apk zhiyong
          cp unsigned.apk zhiyong7253-remote-${{ inputs.arch }}.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zhiyong7253-remote-${{ inputs.arch }}.apk
          path: zhiyong7253-remote-${{ inputs.arch }}.apk
          compression-level: 0
