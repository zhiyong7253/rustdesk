name: Build zhiyong7253 (Quick APK Patch)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options:
          - aarch64
          - armv7a
        default: aarch64

env:
  VERSION: "1.4.6"
  NEW_PKG: "com.zhiyong7253.remote"
  NEW_NAME: "zhiyong7253"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool_2.10.0.jar /usr/local/bin/

      - name: Download official APK
        run: |
          wget -q "https://github.com/rustdesk/rustdesk/releases/download/${VERSION}/rustdesk-${VERSION}-${{ inputs.arch }}-signed.apk" -O original.apk

      - name: Decompile
        run: apktool d original.apk -o out -f

      - name: Patch package name (safe)
        run: |
          # AndroidManifest.xml - only change specific attributes
          sed -i 's|package="com.carriez.flutter_hbb"|package="'"${NEW_PKG}"'"|' out/AndroidManifest.xml
          sed -i 's|android:label="RustDesk"|android:label="'"${NEW_NAME}"'"|' out/AndroidManifest.xml
          sed -i 's|android:label="RustDesk Input"|android:label="'"${NEW_NAME}"' Input"|' out/AndroidManifest.xml
          sed -i 's|com.carriez.flutter_hbb.DEBUG_BOOT_COMPLETED|'"${NEW_PKG}"'.DEBUG_BOOT_COMPLETED|' out/AndroidManifest.xml
          # Smali files - safe (plain text)
          find out/ -name "*.smali" -exec sed -i 's|com/carriez/flutter_hbb|'"${NEW_PKG}"'|g' {} +
          find out/ -name "*.smali" -exec sed -i 's|com/zhiyong7253/remote|'"${NEW_PKG}"'|g' {} +
          # DO NOT touch XML files with sed! They are binary AXML format.
          # Rename package directories
          for d in $(find out/ -type d -name "carriez" 2>/dev/null); do
            parent=$(dirname "$d")
            mkdir -p "$parent/zhiyong7253"
            if [ -d "$d/flutter_hbb" ]; then
              mv "$d/flutter_hbb" "$parent/zhiyong7253/remote"
            fi
          done
          echo "Package patched"

      - name: Rebuild
        run: apktool b out -o unsigned.apk

      - name: Sign with apksigner (v1+v2+v3)
        run: |
          cd $GITHUB_WORKSPACE
          # Generate keystore
          keytool -genkey -v -keystore release.keystore -alias zhiyong -keyalg RSA -keysize 2048 -validity 10000 -storepass zhiyong -keypass zhiyong -dname "CN=zhiyong7253, O=zhiyong, C=CN"
          # Install build-tools for apksigner
          mkdir -p $HOME/android-sdk
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" 2>&1 | tail -3 || true
          cd $GITHUB_WORKSPACE
          SDK_DIR=$HOME/android-sdk
          APKSIGNER=$(find $SDK_DIR -name apksigner -type f | head -1)
          ZIPALIGN=$(find $SDK_DIR -name zipalign -type f | head -1)
          echo "apksigner: $APKSIGNER"
          echo "zipalign: $ZIPALIGN"
          # Zipalign
          $ZIPALIGN -v -p 4 unsigned.apk aligned.apk 2>&1 | tail -2
          # Sign
          $APKSIGNER sign --ks $GITHUB_WORKSPACE/release.keystore --ks-pass pass:zhiyong --ks-key-alias zhiyong aligned.apk
          cp aligned.apk zhiyong7253-remote-${{ inputs.arch }}.apk
          echo "Signing complete"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zhiyong7253-remote-${{ inputs.arch }}.apk
          path: zhiyong7253-remote-${{ inputs.arch }}.apk
          compression-level: 0
