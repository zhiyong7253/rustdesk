name: Build zhiyong7253 (Quick APK Patch)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options:
          - aarch64
          - armv7a
        default: aarch64

env:
  VERSION: "1.4.6"
  NEW_PKG: "com.zhiyong7253.remote"
  NEW_NAME: "zhiyong7253"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool_2.10.0.jar /usr/local/bin/

      - name: Download official APK
        run: |
          wget -q "https://github.com/rustdesk/rustdesk/releases/download/${VERSION}/rustdesk-${VERSION}-${{ inputs.arch }}-signed.apk" -O original.apk

      - name: Decompile
        run: apktool d original.apk -o out -f

      - name: Patch package name
        run: |
          sed -i "s|package=\"com.carriez.flutter_hbb\"|package=\"${NEW_PKG}\"|g" out/AndroidManifest.xml
          sed -i "s|android:label=\"RustDesk\"|android:label=\"${NEW_NAME}\"|g" out/AndroidManifest.xml
          sed -i "s|android:label=\"RustDesk Input\"|android:label=\"${NEW_NAME} Input\"|g" out/AndroidManifest.xml
          # Replace in all smali/xml
          find out/ -name "*.smali" -exec sed -i "s|com/carriez/flutter_hbb|com/zhiyong7253/remote|g" {} +
          find out/ -name "*.xml" -exec sed -i "s|RustDesk|${NEW_NAME}|g" {} +

      - name: Rebuild
        run: apktool b out -o unsigned.apk

      - name: Sign with apksigner (v1+v2+v3)
        run: |
          # Generate keystore
          keytool -genkey -v -keystore release.keystore -alias zhiyong -keyalg RSA -keysize 2048 -validity 10000 -storepass zhiyong -keypass zhiyong -dname "CN=zhiyong7253, O=zhiyong, C=CN"
          # First jarsigner for v1
          jarsigner -keystore release.keystore -storepass zhiyong -keypass zhiyong -sigalg SHA256withRSA unsigned.apk zhiyong
          # Install Android SDK build-tools for apksigner
          mkdir -p $HOME/android-sdk
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          APKSIGNER=$(find $HOME/android-sdk -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            # Zip align
            ZIPALIGN=$(find $HOME/android-sdk -name "zipalign" -type f 2>/dev/null | head -1)
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 unsigned.apk aligned.apk 2>&1 | tail -3
              mv aligned.apk unsigned.apk
            fi
            # Sign with v2+v3
            $APKSIGNER sign --ks release.keystore --ks-pass pass:zhiyong --ks-key-alias zhiyong --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true unsigned.apk
          fi
          cp unsigned.apk zhiyong7253-remote-${{ inputs.arch }}.apk
          echo "Signing complete"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zhiyong7253-remote-${{ inputs.arch }}.apk
          path: zhiyong7253-remote-${{ inputs.arch }}.apk
          compression-level: 0
