# =============================================================
# zhiyong7253 杩滅▼鎺у埗 鈥?Windows 瀹㈡埛绔紪璇?# =============================================================
name: 馃敡 Build zhiyong7253 Remote (Windows)

on:
  workflow_dispatch:
  # 涔熷彲浠?push 鏃惰嚜鍔ㄨЕ鍙戯紝浣嗗厛淇濇寔鎵嬪姩

env:
  NEW_APP_NAME: "zhiyong7253"
  ID_SERVER: "www.zhiyong7253.vip"
  RELAY_SERVER: "www.zhiyong7253.vip"
  SERVER_KEY: "Xzy860329"

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source (v1.4.6)
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.6
          submodules: recursive
          fetch-depth: 1

      # ===== 鍝佺墝淇敼 =====
      - name: Patch APP_NAME and server config (safe)
        shell: bash
        run: |
          CFG="libs/hbb_common/src/config.rs"
          # APP_NAME - exact match for 1.4.6
          sed -i 's/"RustDesk"/"'"${NEW_APP_NAME}"'"/g' "$CFG"
          # Server - just replace the URL
          sed -i 's/"rs-ny.rustdesk.com"/"'"${ID_SERVER}"'"/g' "$CFG"
          echo "APP_NAME -> ${NEW_APP_NAME}"
          echo "Server -> ${ID_SERVER}"

      # ===== 瀹夎 Rust =====
      - name: 馃 瀹夎 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75
          targets: x86_64-pc-windows-msvc

      - name: 馃摝 瀹夎 Sciter SDK
        shell: bash
        run: |
          mkdir -p target/sciter
          cd target/sciter
          curl -LO https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin/windows/x64/sciter.dll
          echo "Sciter SDK installed"

      # ===== 缂栬瘧 =====
      - name: 馃彈锔?缂栬瘧
        shell: bash
        run: |
          cargo build --release --features flutter
          echo "Build complete"

      # ===== 鎵撳寘 =====
      - name: 馃摝 鎵撳寘
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rustdesk.exe dist/zhiyong7253-remote.exe
          # Create launcher with pre-configured server
          cat > dist/start.bat << 'BAT'
          @echo off
          chcp 65001 >nul
          title zhiyong7253 Remote
          echo ========================================
          echo    zhiyong7253 Remote v1.4.6  Windows
          echo ========================================
          echo.
          echo 姝ｅ湪閰嶇疆鏈嶅姟鍣ㄤ俊鎭?..
          set "APPDATA_DIR=%APPDATA%\RustDesk\config"
          if not exist "%APPDATA_DIR%" mkdir "%APPDATA_DIR%"
          (
          echo [options]
          echo rendezvous_server = "www.zhiyong7253.vip"
          echo relay_server = "www.zhiyong7253.vip"
          echo key = "Xzy860329"
          echo.
          echo [client]
          echo auto_start = false
          echo hide_settings = false
          ) > "%APPDATA_DIR%\RustDesk2.toml"
          echo [OK] 鏈嶅姟鍣ㄩ厤缃凡鍐欏叆
          echo    ID: www.zhiyong7253.vip
          echo    Key: Xzy860329
          echo.
          start "" "%~dp0zhiyong7253-remote.exe"
          BAT
          
          echo "Packaged"

      - name: 馃摛 涓婁紶
        uses: actions/upload-artifact@v4
        with:
          name: zhiyong7253-remote-windows
          path: dist/
          compression-level: 0
